-- Doorway rice — network-admin monitoring card (top right of the ViewSonic).
-- Toggle: Super+M  ·  restart: ~/rice/bin/doorway-card restart
-- Data comes from ~/rice/bin/doorway-stat. Columns: label 0 · value 84 · label 210 · value 290.
-- Sizes are written at 1x: conky (>=1.18) already scales geometry by Xft.dpi,
-- and fonts are given in points so Xft scales them too. Only the Lua card
-- background works in raw pixels (DOORWAY_S there).
local function font(w, n) return 'GeistMono Nerd Font:' .. (w ~= '' and (w .. ':') or '') .. 'size=' .. (n * 0.75) end
local STAT = '~/rice/bin/doorway-stat '

conky.config = {
  lua_load = '~/rice/conky/doorway.lua',
  lua_draw_hook_pre = 'card',

  own_window = true, own_window_type = 'desktop', own_window_class = 'Conky',
  own_window_argb_visual = true, own_window_transparent = true,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

  -- same screen as the panel (the laptop): doorway-card passes its xinerama number
  xinerama_head = tonumber(os.getenv('DOORWAY_HEAD') or '0'),
  alignment = 'top_right', gap_x = 27, gap_y = 72,   -- under the 40px top panel; gap_x 27 lines the right edge up with the panel's right island
  minimum_width = 390, maximum_width = 390,
  border_inner_margin = 20, border_outer_margin = 0,

  double_buffer = true, update_interval = 2, cpu_avg_samples = 2,
  use_xft = true, font = font('', 13), override_utf8_locale = true,
  draw_shades = false, draw_borders = false, draw_outline = false,
  short_units = true, format_human_readable = true,

  color0 = '7c9196', color1 = 'e8dfc6', color2 = 'f2e5b8', color3 = '4f9aa6', color4 = 'e39236',
  color5 = 'd78615', color6 = 'cd5c45', color7 = '9aa556', color8 = 'b39aab', color9 = '2c4a50',
}

local R = '${font}'
local SMALL = '${font ' .. font('', 11) .. '}'
local function section(s) return '${voffset 4}${color4}${font ' .. font('semibold', 11) .. '}' .. s .. R .. ' ${color9}${hr 1}' end
local function x(sec, what) return '${execpi ' .. sec .. ' ' .. STAT .. what .. '}' end
local V, L2, V2 = '${goto 84}', '${goto 210}', '${goto 290}'

conky.text = table.concat({
  '${color2}${font ' .. font('semibold', 17) .. '}${nodename}' .. R ..
    '${alignr}' .. SMALL .. '${if_gw}${color7}● online${else}${color6}● offline${endif}' .. R,
  '${color0}' .. SMALL .. 'up ${uptime_short}  ·  mint ${execi 3600 lsb_release -rs}  ·  cinnamon' .. R,
  section('SYSTEM'),
  '${color0}cpu' .. V .. '${color1}${cpu cpu0}%  ' .. x(4, 'cputemp') .. L2 .. '${color0}ram' .. V2 .. '${color1}${mem} / ${memmax}',
  x(30, 'disk') .. L2 .. '${color0}bat' .. V2 .. '${color1}${battery_percent BAT0}%',
  x(4, 'gpu'),
  x(6, 'fans'),
  x(10, 'link'),
  section('NETWORK'),
  x(10, 'net'),
  x(2, 'speed'),
  section('HEALTH'),
  x(15, 'health'),
  section('CONNECTIONS'),
  x(10, 'conns'),
  section('MEMORY'),
  x(5, 'mem'),
}, '\n')
